<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - BusHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .bookings-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding-top: 100px;
            padding-bottom: 4rem;
        }

        .booking-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .booking-item:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 15px 40px rgba(6, 182, 212, 0.2);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .booking-status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-confirmed {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .detail-label {
            color: var(--gray-400);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .detail-value {
            color: var(--white);
            font-weight: 600;
        }

        .booking-actions {
            display: flex;
            gap: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: var(--white);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--white);
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.5;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-bus"></i> BusHub
            </div>
            <div class="navbar-buttons"></div>
        </div>
    </nav>

    <div class="bookings-container">
        <div class="container">
            <h2 style="color: var(--white); margin-bottom: 0.5rem;">
                <i class="fas fa-ticket-alt"></i> My Bookings
            </h2>
            <p style="color: var(--gray-300); margin-bottom: 2rem;">View and manage all your bus tickets</p>

            <div id="bookingsList">
                <div class="empty-state">
                    <div class="spinner"></div>
                    <p>Loading bookings...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        window.addEventListener('load', async () => {
            if (!isLoggedIn()) {
                window.location.href = '/login';
                return;
            }

            loadBookings();
        });

        async function loadBookings() {
            const response = await apiRequest('/bookings/my-bookings');
            const container = document.getElementById('bookingsList');

            if (response.success && response.bookings && response.bookings.length > 0) {
                container.innerHTML = response.bookings.map(booking => `
                    <div class="booking-item">
                        <div class="booking-header">
                            <div>
                                <h4 style="color: var(--white); margin: 0 0 0.5rem 0;">${booking.bus_name}</h4>
                                <p style="color: var(--gray-400); margin: 0; font-size: 0.9rem;">${booking.booking_id}</p>
                            </div>
                            <span class="booking-status status-${booking.booking_status.toLowerCase()}">
                                ${booking.booking_status}
                            </span>
                        </div>

                        <div class="booking-details">
                            <div class="detail-item">
                                <span class="detail-label">Route</span>
                                <span class="detail-value">${booking.source} → ${booking.destination}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Travel Date</span>
                                <span class="detail-value">${formatDate(booking.departure_date)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Total Fare</span>
                                <span class="detail-value">${formatCurrency(booking.total_fare)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Payment Status</span>
                                <span class="detail-value">${booking.payment_status || 'N/A'}</span>
                            </div>
                        </div>

                        <div class="booking-actions">
                            <button class="action-btn" onclick="viewTicket('${booking.booking_id}')">
                                <i class="fas fa-eye"></i> View Ticket
                            </button>
                            ${booking.booking_status === 'Confirmed' ? `
                                <button class="action-btn danger" onclick="cancelBooking('${booking.booking_id}')">
                                    <i class="fas fa-times"></i> Cancel Booking
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No Bookings Found</h3>
                        <p>You haven't booked any buses yet. Start booking now!</p>
                        <a href="/search" class="btn btn-primary" style="margin-top: 1rem; display: inline-block;">
                            <i class="fas fa-search"></i> Search Buses
                        </a>
                    </div>
                `;
            }
        }

        function viewTicket(bookingId) {
            sessionStorage.setItem('viewBookingId', bookingId);
            window.location.href = '/confirmation';
        }

        async function cancelBooking(bookingId) {
            if (!confirm('Are you sure you want to cancel this booking?')) {
                return;
            }

            showLoader('Cancelling booking...');
            const response = await apiRequest(`/bookings/${bookingId}/cancel`, 'PUT');
            hideLoader();

            if (response.success) {
                showNotification('Booking cancelled successfully', 'success');
                loadBookings();
            } else {
                showNotification(response.message || 'Cancellation failed', 'danger');
            }
        }
    </script>
</body>
</html>
