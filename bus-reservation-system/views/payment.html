<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - BusHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .payment-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding-top: 100px;
            padding-bottom: 4rem;
        }

        .payment-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .payment-methods {
            display: grid;
            gap: 1.5rem;
        }

        .payment-method {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .payment-method:hover {
            border-color: var(--neon-cyan);
            background: rgba(6, 182, 212, 0.15);
        }

        .payment-method.active {
            border-color: var(--secondary);
            background: rgba(79, 70, 229, 0.2);
        }

        .payment-method input[type="radio"] {
            display: none;
        }

        .payment-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .payment-icon {
            font-size: 2rem;
            color: var(--neon-cyan);
        }

        .payment-method.active .payment-icon {
            color: var(--secondary);
        }

        .payment-title {
            color: var(--white);
            font-weight: 600;
            margin: 0;
        }

        .payment-desc {
            color: var(--gray-400);
            font-size: 0.9rem;
            margin: 0;
        }

        .payment-form {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
            max-height: 0;
            overflow: hidden;
            transition: var(--transition);
        }

        .payment-method.active .payment-form {
            max-height: 500px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            color: var(--white);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-field input,
        .form-field select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--white);
            font-size: 0.95rem;
        }

        .form-field input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-title {
            color: var(--white);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .summary-item:last-of-type {
            border-bottom: 2px solid rgba(6, 182, 212, 0.3);
        }

        .summary-label {
            color: var(--gray-300);
        }

        .summary-value {
            font-weight: 600;
        }

        .total-amount {
            font-size: 1.5rem;
            color: var(--neon-cyan);
            font-weight: 700;
            margin: 1.5rem 0;
            text-align: center;
        }

        .payment-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--success), #059669);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .payment-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
        }

        .payment-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--success);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .payment-layout {
                grid-template-columns: 1fr;
            }

            .summary-card {
                position: static;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-bus"></i> BusHub
            </div>
            <div class="navbar-buttons"></div>
        </div>
    </nav>

    <div class="payment-container">
        <div class="container">
            <h2 style="color: var(--white); text-align: center; margin-bottom: 1rem;">
                <i class="fas fa-credit-card"></i> Payment Details
            </h2>
            <p style="text-align: center; color: var(--gray-300); margin-bottom: 2rem;">Choose your preferred payment method</p>

            <form onsubmit="handlePayment(event)" class="payment-layout" id="paymentForm">
                <div class="payment-methods">
                    <!-- UPI Payment -->
                    <label class="payment-method active">
                        <input type="radio" name="paymentMethod" value="UPI" checked onchange="updatePaymentMethod('UPI')">
                        <div class="payment-header">
                            <div class="payment-icon"><i class="fas fa-mobile-alt"></i></div>
                            <div>
                                <p class="payment-title">UPI Payment</p>
                                <p class="payment-desc">Pay using Google Pay, PhonePe, Paytm</p>
                            </div>
                        </div>
                        <div class="payment-form">
                            <div class="form-field">
                                <label>UPI ID</label>
                                <input type="text" placeholder="yourname@upi" required>
                            </div>
                            <div class="form-field">
                                <label>Mobile Number</label>
                                <input type="tel" placeholder="10-digit phone number" pattern="[0-9]{10}" required>
                            </div>
                        </div>
                    </label>

                    <!-- Card Payment -->
                    <label class="payment-method">
                        <input type="radio" name="paymentMethod" value="Card" onchange="updatePaymentMethod('Card')">
                        <div class="payment-header">
                            <div class="payment-icon"><i class="fas fa-credit-card"></i></div>
                            <div>
                                <p class="payment-title">Debit/Credit Card</p>
                                <p class="payment-desc">Visa, MasterCard, American Express</p>
                            </div>
                        </div>
                        <div class="payment-form">
                            <div class="form-field">
                                <label>Card Number</label>
                                <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" pattern="[0-9 ]{19}" disabled>
                            </div>
                            <div class="form-row">
                                <div class="form-field">
                                    <label>Expiry Date</label>
                                    <input type="text" placeholder="MM/YY" maxlength="5" pattern="[0-9]{2}/[0-9]{2}" disabled>
                                </div>
                                <div class="form-field">
                                    <label>CVV</label>
                                    <input type="text" placeholder="123" maxlength="3" pattern="[0-9]{3}" disabled>
                                </div>
                            </div>
                            <div class="form-field">
                                <label>Cardholder Name</label>
                                <input type="text" placeholder="John Doe" disabled>
                            </div>
                        </div>
                    </label>

                    <!-- Net Banking -->
                    <label class="payment-method">
                        <input type="radio" name="paymentMethod" value="NetBanking" onchange="updatePaymentMethod('NetBanking')">
                        <div class="payment-header">
                            <div class="payment-icon"><i class="fas fa-bank"></i></div>
                            <div>
                                <p class="payment-title">Net Banking</p>
                                <p class="payment-desc">All major banks supported</p>
                            </div>
                        </div>
                        <div class="payment-form">
                            <div class="form-field">
                                <label>Select Bank</label>
                                <select disabled>
                                    <option>- Select Bank -</option>
                                    <option>HDFC Bank</option>
                                    <option>ICICI Bank</option>
                                    <option>SBI Bank</option>
                                    <option>Axis Bank</option>
                                </select>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- Summary -->
                <div class="summary-card">
                    <h4 class="summary-title">Order Summary</h4>

                    <div class="summary-item">
                        <span class="summary-label">Bus Fare</span>
                        <span class="summary-value" id="busfare">₹0</span>
                    </div>

                    <div class="summary-item">
                        <span class="summary-label">Seats</span>
                        <span class="summary-value" id="numseats">0</span>
                    </div>

                    <div class="summary-item">
                        <span class="summary-label">Taxes & Fees</span>
                        <span class="summary-value">₹50</span>
                    </div>

                    <div class="total-amount" id="totalpayment">₹0</div>

                    <button type="submit" class="payment-btn" id="payBtn">
                        <i class="fas fa-lock"></i> Complete Payment
                    </button>

                    <div class="security-badge">
                        <i class="fas fa-shield-alt"></i>
                        Secured by 256-bit SSL Encryption
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        let bookingData = {};
        let selectedPaymentMethod = 'UPI';

        window.addEventListener('load', () => {
            if (!isLoggedIn()) {
                window.location.href = '/login';
                return;
            }

            bookingData = getBookingData();
            if (!bookingData || !bookingData.total_fare) {
                window.location.href = '/search';
                return;
            }

            loadPaymentSummary();
        });

        function loadPaymentSummary() {
            const total = bookingData.total_fare + 50; // Add taxes
            document.getElementById('busfare').textContent = formatCurrency(bookingData.total_fare);
            document.getElementById('numseats').textContent = bookingData.num_passengers + ' Seats';
            document.getElementById('totalpayment').textContent = formatCurrency(total);
        }

        function updatePaymentMethod(method) {
            selectedPaymentMethod = method;
            document.querySelectorAll('.payment-method').forEach(pm => pm.classList.remove('active'));
            event.target.closest('.payment-method').classList.add('active');

            // Enable/disable fields based on method
            const currentForm = event.target.closest('.payment-method');
            const inputs = currentForm.querySelectorAll('input[type="text"], input[type="tel"], select');
            inputs.forEach(input => {
                if (method === 'UPI' && (input.placeholder.includes('UPI') || input.placeholder.includes('Mobile'))) {
                    input.disabled = false;
                } else if (method === 'Card' && (input.placeholder.includes('Card') || input.placeholder.includes('Expiry') || input.placeholder.includes('CVV') || input.placeholder.includes('Cardholder'))) {
                    input.disabled = false;
                } else if (method === 'NetBanking') {
                    input.disabled = false;
                } else {
                    input.disabled = true;
                }
            });
        }

        async function handlePayment(event) {
            event.preventDefault();

            const payBtn = document.getElementById('payBtn');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            // Create booking first
            showLoader('Creating booking...');

            const bookingResponse = await apiRequest('/bookings/create', 'POST', {
                schedule_id: bookingData.schedule_id,
                selected_seats: bookingData.selected_seats,
                num_passengers: bookingData.num_passengers,
                boarding_point: 'Main Terminal',
                dropping_point: 'Central Bus Stand'
            });

            if (!bookingResponse.success) {
                hideLoader();
                showNotification('Booking creation failed', 'danger');
                payBtn.disabled = false;
                payBtn.textContent = 'Complete Payment';
                return;
            }

            const bookingId = bookingResponse.bookingId;

            // Process payment
            hideLoader();
            showLoader('Processing payment...');

            const paymentResponse = await apiRequest('/payments/process', 'POST', {
                booking_id: bookingId,
                payment_method: selectedPaymentMethod,
                amount: bookingData.total_fare + 50
            });

            hideLoader();

            if (paymentResponse.success) {
                sessionStorage.setItem('bookingId', bookingId);
                sessionStorage.setItem('transactionId', paymentResponse.transaction_id);
                showNotification('Payment successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/confirmation';
                }, 1500);
            } else {
                showNotification('Payment failed. Please try again.', 'danger');
                payBtn.disabled = false;
                payBtn.textContent = 'Complete Payment';
            }
        }
    </script>
</body>
</html>
