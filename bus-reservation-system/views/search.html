<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Buses - BusHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .search-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding-top: 100px;
            padding-bottom: 4rem;
        }

        .search-header {
            margin-bottom: 2rem;
        }

        .search-filters {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group label {
            color: var(--white);
            font-weight: 600;
            display: block;
            margin-bottom: 0.75rem;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--white);
            font-size: 0.95rem;
        }

        .checkbox-filter {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
        }

        .checkbox-filter input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-filter label {
            margin: 0;
            color: var(--gray-200);
            cursor: pointer;
            font-weight: 400;
        }

        .search-results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-count {
            color: var(--white);
            font-weight: 600;
        }

        .sort-options {
            display: flex;
            gap: 0.5rem;
        }

        .sort-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
        }

        .sort-btn:hover,
        .sort-btn.active {
            background: rgba(6, 182, 212, 0.3);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .buses-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .bus-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 2rem;
            transition: var(--transition);
            cursor: pointer;
            align-items: center;
        }

        .bus-item:hover {
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 15px 40px rgba(6, 182, 212, 0.2);
            transform: translateY(-4px);
        }

        .bus-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--white);
        }

        .bus-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 2rem;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .info-label {
            color: var(--gray-300);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: var(--white);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .info-detail {
            color: var(--gray-300);
            font-size: 0.9rem;
        }

        .bus-price-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1rem;
        }

        .bus-price {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bus-seats {
            color: var(--success);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .book-btn {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
        }

        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.5);
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--white);
        }

        .no-results i {
            font-size: 4rem;
            opacity: 0.5;
            margin-bottom: 1rem;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(6, 182, 212, 0.2);
            color: var(--neon-cyan);
            padding: 0.35rem 0.75rem;
            border-radius: 0.3rem;
            font-size: 0.8rem;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        @media (max-width: 1024px) {
            .bus-info {
                grid-template-columns: 1fr 1fr;
            }

            .bus-item {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .bus-price-section {
                align-items: flex-start;
                flex-direction: row;
                justify-content: space-between;
            }
        }

        @media (max-width: 768px) {
            .bus-info {
                grid-template-columns: 1fr;
            }

            .sort-options {
                flex-direction: column;
                width: 100%;
            }

            .sort-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-bus"></i> BusHub
            </div>
            <ul class="navbar-menu">
                <li><a href="/" class="navbar-link">Home</a></li>
                <li><a href="/search" class="navbar-link">Search Buses</a></li>
                <li><a href="/bookings" class="navbar-link">My Bookings</a></li>
            </ul>
            <div class="navbar-buttons"></div>
        </div>
    </nav>

    <div class="search-container">
        <div class="container">
            <div class="search-header">
                <h2 style="color: var(--white); display: flex; align-items: center; gap: 1rem;">
                    <i class="fas fa-search"></i> Search Results
                </h2>
            </div>

            <div style="display: grid; grid-template-columns: 250px 1fr; gap: 2rem; margin-bottom: 2rem;">
                <!-- FILTERS SIDEBAR -->
                <div>
                    <div class="search-filters">
                        <h4 style="color: var(--white); margin-bottom: 1.5rem;">
                            <i class="fas fa-sliders-h"></i> Filters
                        </h4>

                        <div class="filter-group">
                            <label>Bus Type</label>
                            <div class="checkbox-filter">
                                <input type="checkbox" id="filterAC" onchange="applyFilters()">
                                <label for="filterAC">AC</label>
                            </div>
                            <div class="checkbox-filter">
                                <input type="checkbox" id="filterNonAC" onchange="applyFilters()">
                                <label for="filterNonAC">Non-AC</label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label>Seating Type</label>
                            <div class="checkbox-filter">
                                <input type="checkbox" id="filterSeater" onchange="applyFilters()">
                                <label for="filterSeater">Seater</label>
                            </div>
                            <div class="checkbox-filter">
                                <input type="checkbox" id="filterSleeper" onchange="applyFilters()">
                                <label for="filterSleeper">Sleeper</label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label>Max Price</label>
                            <input type="range" id="priceRange" min="0" max="10000" step="100" value="10000" onchange="applyFilters()">
                            <p style="color: var(--neon-cyan); margin-top: 0.5rem; font-weight: 600;">
                                ₹<span id="priceValue">10000</span>
                            </p>
                        </div>

                        <button class="btn btn-primary btn-block" onclick="resetFilters()">
                            <i class="fas fa-redo"></i> Reset Filters
                        </button>
                    </div>
                </div>

                <!-- RESULTS SECTION -->
                <div>
                    <div class="search-results-header">
                        <div class="results-count">
                            <span id="resultsCount">0</span> buses found
                        </div>
                        <div class="sort-options">
                            <button class="sort-btn active" onclick="sortBuses('price')">
                                <i class="fas fa-arrow-up-arrow-down"></i> Price
                            </button>
                            <button class="sort-btn" onclick="sortBuses('departure')">
                                <i class="fas fa-clock"></i> Departure
                            </button>
                            <button class="sort-btn" onclick="sortBuses('rating')">
                                <i class="fas fa-star"></i> Rating
                            </button>
                        </div>
                    </div>

                    <div id="busesGrid" class="buses-grid">
                        <div class="no-results">
                            <div class="spinner" style="margin: 0 auto; margin-bottom: 1rem;"></div>
                            <p>Loading buses...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        let allBuses = [];
        let filteredBuses = [];

        window.addEventListener('load', () => {
            if (!isLoggedIn()) {
                showNotification('Please login to search buses', 'warning');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
                return;
            }

            loadSearchResults();
        });

        async function loadSearchResults() {
            const searchParams = JSON.parse(sessionStorage.getItem('searchParams') || '{}');
            const { source, destination, date } = searchParams;

            if (!source || !destination || !date) {
                document.getElementById('busesGrid').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-info-circle"></i>
                        <h3>No search parameters provided</h3>
                        <p><a href="/" style="color: var(--neon-cyan);">Go back to home</a></p>
                    </div>
                `;
                return;
            }

            showLoader('Searching buses...');
            const response = await apiRequest('/buses/search', 'POST', { source, destination, departure_date: date });
            hideLoader();

            if (response.success) {
                allBuses = response.buses;
                filteredBuses = [...allBuses];
                displayBuses(filteredBuses);
            } else {
                document.getElementById('busesGrid').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No buses found</h3>
                        <p>Try searching with different parameters</p>
                    </div>
                `;
            }
        }

        function displayBuses(buses) {
            const grid = document.getElementById('busesGrid');
            document.getElementById('resultsCount').textContent = buses.length;

            if (buses.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No buses match your filters</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = buses.map(bus => `
                <div class="bus-item" onclick="selectBus(${bus.id}, ${bus.schedule_id})">
                    <div class="bus-logo">
                        <i class="fas fa-bus"></i>
                    </div>
                    <div class="bus-info">
                        <div class="info-block">
                            <div class="info-label">Bus Name</div>
                            <div class="info-value">${bus.bus_name}</div>
                            <div class="info-detail">${bus.bus_number}</div>
                        </div>
                        <div class="info-block">
                            <div class="info-label">Departure</div>
                            <div class="info-value">${formatTime(bus.departure_time)}</div>
                            <div class="info-detail">From ${bus.source}</div>
                        </div>
                        <div class="info-block">
                            <div class="info-label">Arrival</div>
                            <div class="info-value">${formatTime(bus.arrival_time)}</div>
                            <div class="info-detail">To ${bus.destination}</div>
                        </div>
                        <div class="info-block">
                            <div class="info-label">Type</div>
                            <div class="info-value">${bus.bus_type}</div>
                            <div class="info-detail">${bus.seating_type}</div>
                        </div>
                    </div>
                    <div class="bus-price-section">
                        <div class="bus-price">${formatCurrency(bus.ticket_price)}</div>
                        <div class="bus-seats"><i class="fas fa-chair"></i> ${bus.available_seats} Seats</div>
                        <div style="display: flex; gap: 0.5rem;">
                            <span class="tag">⭐ ${bus.rating}</span>
                            <span class="tag">${bus.bus_type}</span>
                        </div>
                        <button class="book-btn">Book Now</button>
                    </div>
                </div>
            `).join('');
        }

        function selectBus(busId, scheduleId) {
            sessionStorage.setItem('selectedBusId', busId);
            sessionStorage.setItem('selectedScheduleId', scheduleId);
            window.location.href = '/seats';
        }

        function sortBuses(sortBy) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.sort-btn').classList.add('active');

            const sorted = [...filteredBuses];
            switch(sortBy) {
                case 'price':
                    sorted.sort((a, b) => a.ticket_price - b.ticket_price);
                    break;
                case 'departure':
                    sorted.sort((a, b) => a.departure_time.localeCompare(b.departure_time));
                    break;
                case 'rating':
                    sorted.sort((a, b) => b.rating - a.rating);
                    break;
            }
            displayBuses(sorted);
        }

        function applyFilters() {
            const ac = document.getElementById('filterAC').checked;
            const nonAC = document.getElementById('filterNonAC').checked;
            const maxPrice = parseInt(document.getElementById('priceRange').value);
            document.getElementById('priceValue').textContent = maxPrice;

            filteredBuses = allBuses.filter(bus => {
                let typeMatch = true;
                if (ac || nonAC) {
                    typeMatch = (ac && bus.bus_type === 'AC') || (nonAC && bus.bus_type === 'Non-AC');
                }

                return typeMatch && bus.ticket_price <= maxPrice;
            });

            displayBuses(filteredBuses);
        }

        function resetFilters() {
            document.getElementById('filterAC').checked = false;
            document.getElementById('filterNonAC').checked = false;
            document.getElementById('priceRange').value = 10000;
            document.getElementById('priceValue').textContent = 10000;
            filteredBuses = [...allBuses];
            displayBuses(filteredBuses);
        }
    </script>
</body>
</html>
