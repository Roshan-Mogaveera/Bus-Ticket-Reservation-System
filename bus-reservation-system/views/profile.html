<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - BusHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding-top: 100px;
            padding-bottom: 4rem;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
        }

        .profile-sidebar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--white);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .profile-name {
            text-align: center;
            color: var(--white);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-email {
            text-align: center;
            color: var(--gray-400);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 0.5rem;
        }

        .sidebar-menu a {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--gray-300);
            border-radius: 0.5rem;
            transition: var(--transition);
            text-decoration: none;
            font-weight: 500;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: rgba(6, 182, 212, 0.2);
            color: var(--neon-cyan);
            border-left: 3px solid var(--neon-cyan);
            padding-left: calc(1rem - 3px);
        }

        .profile-content {
            display: grid;
            gap: 2rem;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
        }

        .card-title {
            color: var(--white);
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--white);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--white);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--neon-cyan);
            outline: none;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .save-btn {
            background: linear-gradient(135deg, var(--success), #059669);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .save-btn:hover {
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 0.5rem;
        }

        .stat-number {
            color: var(--neon-cyan);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            color: var(--gray-400);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }

            .profile-sidebar {
                position: static;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-bus"></i> BusHub
            </div>
            <div class="navbar-buttons"></div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="container">
            <div class="profile-layout">
                <!-- SIDEBAR -->
                <div class="profile-sidebar">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-name" id="userName">Your Name</div>
                    <div class="profile-email" id="userEmail">email@example.com</div>

                    <ul class="sidebar-menu">
                        <li><a href="#profile-info" class="menu-link active" data-section="profile-info"><i class="fas fa-user"></i> Profile Info</a></li>
                        <li><a href="#address" class="menu-link" data-section="address"><i class="fas fa-map-marker-alt"></i> Address</a></li>
                        <li><a href="#password" class="menu-link" data-section="password"><i class="fas fa-lock"></i> Password</a></li>
                        <li><a href="#stats" class="menu-link" data-section="stats"><i class="fas fa-chart-bar"></i> Statistics</a></li>
                        <li><a href="/" onclick="logout()" style="color: var(--danger);"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                    </ul>
                </div>

                <!-- CONTENT -->
                <div class="profile-content">
                    <!-- PROFILE INFO SECTION -->
                    <div class="profile-card section" id="section-profile-info">
                        <h3 class="card-title">
                            <i class="fas fa-user-circle"></i> Personal Information
                        </h3>

                        <form onsubmit="updateProfile(event)">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Full Name</label>
                                    <input type="text" id="fullName" required>
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="email" disabled>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="phone" required>
                                </div>
                            </div>

                            <button type="submit" class="save-btn">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </form>
                    </div>

                    <!-- ADDRESS SECTION -->
                    <div class="profile-card section" id="section-address" style="display: none;">
                        <h3 class="card-title">
                            <i class="fas fa-map-marker-alt"></i> Address
                        </h3>

                        <form onsubmit="updateProfile(event)">
                            <div class="form-group">
                                <label>Address</label>
                                <textarea id="address" rows="3"></textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>City</label>
                                    <input type="text" id="city">
                                </div>
                                <div class="form-group">
                                    <label>State</label>
                                    <input type="text" id="state">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Pincode</label>
                                <input type="text" id="pincode" pattern="[0-9]{6}">
                            </div>

                            <button type="submit" class="save-btn">
                                <i class="fas fa-save"></i> Save Address
                            </button>
                        </form>
                    </div>

                    <!-- PASSWORD SECTION -->
                    <div class="profile-card section" id="section-password" style="display: none;">
                        <h3 class="card-title">
                            <i class="fas fa-lock"></i> Change Password
                        </h3>

                        <form onsubmit="changePassword(event)">
                            <div class="form-group">
                                <label>Current Password</label>
                                <input type="password" id="currentPassword" required>
                            </div>

                            <div class="form-group">
                                <label>New Password</label>
                                <input type="password" id="newPassword" required>
                            </div>

                            <div class="form-group">
                                <label>Confirm Password</label>
                                <input type="password" id="confirmPassword" required>
                            </div>

                            <button type="submit" class="save-btn">
                                <i class="fas fa-lock"></i> Update Password
                            </button>
                        </form>
                    </div>

                    <!-- STATISTICS SECTION -->
                    <div class="profile-card section" id="section-stats" style="display: none;">
                        <h3 class="card-title">
                            <i class="fas fa-chart-bar"></i> Booking Statistics
                        </h3>

                        <div class="stats-grid" id="statsGrid">
                            <div class="stat-item">
                                <div class="stat-number">0</div>
                                <div class="stat-label">Total Bookings</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">0</div>
                                <div class="stat-label">Confirmed</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">0</div>
                                <div class="stat-label">Cancelled</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">₹0</div>
                                <div class="stat-label">Total Spent</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        window.addEventListener('load', async () => {
            if (!isLoggedIn()) {
                window.location.href = '/login';
                return;
            }

            loadProfile();
            setupMenuLinks();
        });

        async function loadProfile() {
            const response = await apiRequest('/auth/me');
            if (response.success) {
                const user = response.user;
                document.getElementById('userName').textContent = user.full_name;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('fullName').value = user.full_name;
                document.getElementById('email').value = user.email;
                document.getElementById('phone').value = user.phone || '';
                document.getElementById('address').value = user.address || '';
                document.getElementById('city').value = user.city || '';
                document.getElementById('state').value = user.state || '';
                document.getElementById('pincode').value = user.pincode || '';
            }

            loadStats();
        }

        async function loadStats() {
            const response = await apiRequest('/users/stats/bookings');
            if (response.success) {
                const stats = response.stats;
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-number">${stats.total_bookings}</div>
                        <div class="stat-label">Total Bookings</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${stats.confirmed_bookings}</div>
                        <div class="stat-label">Confirmed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${stats.cancelled_bookings}</div>
                        <div class="stat-label">Cancelled</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${formatCurrency(stats.total_spent || 0)}</div>
                        <div class="stat-label">Total Spent</div>
                    </div>
                `;
            }
        }

        function setupMenuLinks() {
            document.querySelectorAll('.menu-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
                    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
                    
                    link.classList.add('active');
                    const sectionId = 'section-' + link.dataset.section;
                    document.getElementById(sectionId).style.display = 'block';
                });
            });
        }

        async function updateProfile(event) {
            event.preventDefault();
            showLoader('Updating profile...');
            
            const response = await apiRequest('/users/profile/update', 'PUT', {
                full_name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                pincode: document.getElementById('pincode').value
            });

            hideLoader();

            if (response.success) {
                showNotification('Profile updated successfully', 'success');
                loadProfile();
            } else {
                showNotification('Update failed', 'danger');
            }
        }

        async function changePassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match', 'danger');
                return;
            }

            if (newPassword.length < 6) {
                showNotification('Password must be at least 6 characters', 'danger');
                return;
            }

            showLoader('Updating password...');

            const response = await apiRequest('/users/change-password', 'POST', {
                current_password: document.getElementById('currentPassword').value,
                new_password: newPassword,
                confirm_password: confirmPassword
            });

            hideLoader();

            if (response.success) {
                showNotification('Password changed successfully', 'success');
                event.target.reset();
            } else {
                showNotification(response.message || 'Password change failed', 'danger');
            }
        }
    </script>
</body>
</html>
