<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BusHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding: 2rem;
            margin-top: 60px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-title h2 {
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .auth-title p {
            color: var(--gray-300);
            margin: 0;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: var(--white);
            font-weight: 600;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .form-group input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.875rem;
            color: var(--white);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--neon-cyan);
            outline: none;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            color: var(--gray-300);
            cursor: pointer;
        }

        .forgot-password {
            color: var(--neon-cyan);
            text-decoration: none;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--neon-purple);
        }

        .auth-button {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: var(--white);
            border: none;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.5);
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .auth-divider span {
            color: var(--gray-400);
            font-size: 0.85rem;
        }

        .social-login {
            display: flex;
            gap: 0.75rem;
        }

        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-footer p {
            color: var(--gray-300);
            margin: 0;
        }

        .auth-footer a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--neon-purple);
        }

        .admin-login-link {
            text-align: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-login-link a {
            font-size: 0.85rem;
            color: var(--gray-400);
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-bus"></i> BusHub
            </div>
            <div style="display: flex; gap: 1rem;">
                <a href="/" class="btn btn-outline" style="color: var(--white); border-color: var(--white);">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-title">
                <h2>Welcome Back</h2>
                <p>Login to your BusHub account</p>
            </div>

            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="form-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password" onclick="handleForgotPassword()">Forgot password?</a>
                </div>

                <button type="submit" class="auth-button" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="auth-divider">
                <span>Or continue with</span>
            </div>

            <div class="social-login">
                <button class="social-btn" onclick="showNotification('Social login coming soon!', 'info')">
                    <i class="fab fa-google"></i>
                </button>
                <button class="social-btn" onclick="showNotification('Social login coming soon!', 'info')">
                    <i class="fab fa-facebook"></i>
                </button>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register">Register here</a></p>
                <div class="admin-login-link">
                    <p>Are you an admin? <a href="/admin-login">Admin Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('loginBtn');

            if (!validateEmail(email)) {
                showNotification('Please enter a valid email', 'danger');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            const response = await apiRequest('/auth/login', 'POST', { email, password });

            if (response.success) {
                setToken(response.token);
                setUserData(response.user);
                
                if (remember) {
                    localStorage.setItem('rememberEmail', email);
                }

                showNotification('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/search';
                }, 1500);
            } else {
                showNotification(response.message || 'Login failed', 'danger');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        function handleForgotPassword() {
            showNotification('Password reset link sent to your email!', 'success');
        }

        // Pre-fill email if "Remember me" was used
        window.addEventListener('load', () => {
            if (isLoggedIn()) {
                window.location.href = '/search';
            }

            const rememberedEmail = localStorage.getItem('rememberEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
        });
    </script>
</body>
</html>
