<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BusHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding: 2rem;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-icon {
            font-size: 3rem;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
        }

        .admin-title {
            color: var(--white);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .admin-subtitle {
            color: var(--gray-300);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--white);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.875rem;
            color: var(--white);
            font-size: 1rem;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--neon-cyan);
            outline: none;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: var(--white);
            border: none;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.5);
        }

        .warning-banner {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            border-radius: 0.5rem;
            padding: 1rem;
            color: var(--warning);
            margin-bottom: 2rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-link a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-card">
            <div class="admin-header">
                <div class="admin-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="admin-title">Admin Panel</h1>
                <p class="admin-subtitle">BusHub Management System</p>
            </div>

            <div class="warning-banner">
                <i class="fas fa-shield-alt"></i> Restricted Access - Admin Only
            </div>

            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter admin username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>

                <div class="footer-link">
                    <a href="/" style="text-decoration: none;">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = event.target.querySelector('button');

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const response = await apiRequest('/admin/login', 'POST', { username, password });

            if (response.success) {
                setToken(response.token);
                localStorage.setItem('adminRole', response.admin.role);
                showNotification('Admin login successful!', 'success');
                setTimeout(() => {
                    window.location.href = '/admin-dashboard';
                }, 1500);
            } else {
                showNotification(response.message || 'Login failed', 'danger');
                btn.disabled = false;
                btn.textContent = 'Login to Dashboard';
            }
        }

        // Check if already logged in
        if (isLoggedIn() && localStorage.getItem('adminRole')) {
            window.location.href = '/admin-dashboard';
        }
    </script>
</body>
</html>
